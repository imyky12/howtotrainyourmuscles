# Render blueprint: render.com → New → Blueprint → pick this repo. See DEPLOY.md.
services:
  - type: web
    name: train-your-muscles
    runtime: node
    plan: starter            # the free plan sleeps when idle: a 30-60 s first load, bad for visitors and for Google
    region: singapore        # closest to India; change to oregon/frankfurt if most visitors are elsewhere
    branch: claude/muscle-house
    autoDeploy: true         # every merge to the branch above goes live
    buildCommand: sh site/build.sh
    startCommand: node server.mjs
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CANONICAL_HOST          # everything else (www., *.onrender.com, http) redirects here
        value: trainyourmuscles.site
      - key: SITE_URL                # used in canonical links and the sitemap
        value: https://trainyourmuscles.site
      # secrets and IDs: Render asks for these when the blueprint is created (never commit them)
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: POSTHOG_KEY             # phc_... from PostHog → Project settings
        sync: false
      - key: POSTHOG_HOST            # https://us.i.posthog.com, or https://eu.i.posthog.com for an EU project
        value: https://us.i.posthog.com
      - key: GA_ID                   # G-... from Google Analytics → Admin → Data streams
        sync: false
